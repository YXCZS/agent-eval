[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-workbench"
version = "0.1.0"
description = "Trace-driven evaluation workbench for prompt, RAG, and tool agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "celery>=5.4,<6",
  "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["apps/api", "apps/worker", "examples"]
include = ["agent_eval_api*", "agent_eval_worker*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/worker", "."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "apps/worker", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "apps/worker", "examples"]
exclude = ["^tests/"]
